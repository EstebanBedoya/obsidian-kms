services:
  couchdb:
    image: couchdb:3
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?set COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD}
    volumes:
      - couchdb_data:/opt/couchdb/data
    expose:
      - "5984"

  # One-shot: waits for CouchDB, applies the LiveSync CORS settings
  # (same values as the upstream couchdb-init.ini) and creates the database.
  db-init:
    image: couchdb:3
    depends_on:
      - couchdb
    restart: "no"
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?set COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-obsidiannotes}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        AUTH="$$COUCHDB_USER:$$COUCHDB_PASSWORD"
        URL=http://couchdb:5984
        until curl -sf -u "$$AUTH" "$$URL/_up" >/dev/null 2>&1; do sleep 1; done
        cfg() { curl -sf -u "$$AUTH" -X PUT "$$URL/_node/_local/_config/$$1" -d "\"$$2\"" >/dev/null; }
        cfg couchdb/single_node true
        cfg couchdb/max_document_size 50000000
        cfg chttpd/require_valid_user true
        cfg chttpd/max_http_request_size 4294967296
        cfg chttpd/enable_cors true
        cfg chttpd_auth/require_valid_user true
        cfg httpd/enable_cors true
        cfg cors/origins "app://obsidian.md,capacitor://localhost,http://localhost"
        cfg cors/credentials true
        cfg cors/methods "GET, PUT, POST, HEAD, DELETE"
        cfg cors/headers "accept, authorization, content-type, origin, referer, cache-control"
        cfg cors/max_age 3600
        code=$$(curl -s -o /dev/null -w '%{http_code}' -u "$$AUTH" "$$URL/$$COUCHDB_DATABASE")
        if [ "$$code" != "200" ]; then curl -sf -u "$$AUTH" -X PUT "$$URL/$$COUCHDB_DATABASE" >/dev/null; fi
        echo "CouchDB init done"

  mcp:
    image: ghcr.io/es617/obsidian-sync-mcp:latest
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    expose:
      - "8787"
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:?set COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-obsidiannotes}
      COUCHDB_PASSPHRASE: ${COUCHDB_PASSPHRASE:?set COUCHDB_PASSPHRASE}
      COUCHDB_OBFUSCATE_PROPERTIES: "false"
      VAULT_NAME: ${VAULT_NAME:-Notas}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN}
      BASE_URL: https://sync.mimot.app/mcp
      READ_ONLY: "true"
      DATA_DIR: /data
    volumes:
      - mcp_data:/data

volumes:
  couchdb_data:
  mcp_data:

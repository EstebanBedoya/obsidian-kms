services:
  couchdb:
    image: couchdb:3
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?set COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD}
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./couchdb-init.ini:/opt/couchdb/etc/local.d/livesync.ini
    expose:
      - "5984"

  # One-shot: waits for CouchDB (settings come from couchdb-init.ini at boot)
  # and creates the database if it does not exist.
  # Dokploy puts the services that have a domain (couchdb, mcp) on dokploy-network
  # only, so db-init must join it too or it cannot resolve "couchdb".
  db-init:
    image: couchdb:3
    depends_on:
      - couchdb
    restart: "no"
    networks:
      - dokploy-network
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?set COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-obsidiannotes}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        AUTH="$$COUCHDB_USER:$$COUCHDB_PASSWORD"
        URL=http://couchdb:5984
        until curl -sf -u "$$AUTH" "$$URL/_up" >/dev/null 2>&1; do sleep 1; done
        code=$$(curl -s -o /dev/null -w '%{http_code}' -u "$$AUTH" "$$URL/$$COUCHDB_DATABASE")
        if [ "$$code" != "200" ]; then curl -sf -u "$$AUTH" -X PUT "$$URL/$$COUCHDB_DATABASE" >/dev/null; fi
        echo "CouchDB init done"

  mcp:
    image: ghcr.io/es617/obsidian-sync-mcp:latest
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    expose:
      - "8787"
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:?set COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-obsidiannotes}
      COUCHDB_PASSPHRASE: ${COUCHDB_PASSPHRASE:?set COUCHDB_PASSPHRASE}
      # LiveSync 1.0.33+ vaults use obfuscated IDs; the MCP needs the ID recovery code
      # (sls-id-v1:...) printed by the Setup URI generator, set in Dokploy → Environment.
      COUCHDB_OBFUSCATE_PROPERTIES: ${COUCHDB_OBFUSCATE_PROPERTIES:-true}
      COUCHDB_ID_DERIVATION_KEY: ${COUCHDB_ID_DERIVATION_KEY:?set COUCHDB_ID_DERIVATION_KEY}
      VAULT_NAME: ${VAULT_NAME:-Notas}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN}
      BASE_URL: https://${MCP_DOMAIN:?set MCP_DOMAIN}
      # Writes are limited to WRITE_FOLDERS (comma-separated); the rest of the vault stays read-only.
      # Set READ_ONLY=true in Dokploy to disable all write tools again.
      READ_ONLY: ${READ_ONLY:-false}
      WRITE_FOLDERS: ${WRITE_FOLDERS:-MCP}
      DATA_DIR: /data
    volumes:
      - mcp_data:/data

volumes:
  couchdb_data:
  mcp_data:

networks:
  dokploy-network:
    external: true
